[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankerproto"
version = "0.1.0"
description = "Clean-room Python implementation of the Anker ZX BLE protocol (power banks, chargers, power stations)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = ["pytest>=7", "bleak>=0.22"]

[project.scripts]
ankerproto = "ankerproto.__main__:main"

[tool.setuptools.packages.find]
include = ["ankerproto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
