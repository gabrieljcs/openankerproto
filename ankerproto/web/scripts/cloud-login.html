<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>openankerproto · Anker sign-in</title>
<style>body{background:#101719;color:#e7eeee;font:16px system-ui;margin:0;padding:48px 24px}main{max-width:560px;margin:auto}h1{font-size:30px}p{color:#adc0c5;line-height:1.6}label{display:block;margin:20px 0 7px}input,select,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #395157;border-radius:8px;background:#19262a;color:inherit;font:inherit}button{margin-top:24px;background:#a6f2cf;color:#11261b;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui;line-height:1.6}small{color:#adc0c5}#logout{background:transparent;color:#e7eeee}</style>
<main><small>openankerproto · local cloud diagnostic</small><h1>Sign in to Anker</h1><p>This checks which devices your account can access. Your password goes through this local helper to Anker over HTTPS. Credentials and session tokens stay in memory and are excluded from logs. Firmware installation is not available yet.</p>
<form id="login"><label for="email">Anker email</label><input id="email" type="email" autocomplete="username" required><label for="password">Anker password</label><input id="password" type="password" autocomplete="current-password" required><label for="country">Account country</label><input id="country" maxlength="2" pattern="[A-Za-z]{2}" required><small id="region-note"></small><label for="region">Anker server</label><select id="region" required><option value="">Choose server region</option><option value="com">Global · Brazil, Americas and Asia</option><option value="eu">Europe</option></select><button id="submit">Sign in and read account devices</button></form><pre id="result" role="status" aria-live="polite"></pre><button id="logout" hidden>Sign out and discard local session</button></main>
<script nonce="__NONCE__">
const csrf='__CSRF__';
const detectRegion=__REGION_FUNCTION__;
const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone;
const detected=detectRegion(navigator.languages||[navigator.language],timezone);
document.querySelector('#country').value=detected.country;
document.querySelector('#region').value=detected.region;
document.querySelector('#region-note').textContent=detected.region?`Selected ${detected.country} from your browser language/time zone (${timezone}). Change it if your Anker account uses a different country.`:'Your browser does not identify a supported account region. Choose your account country and server.';
document.querySelector('#country').addEventListener('input',event=>{const defaults=detectRegion(['und-'+event.target.value.toUpperCase()]);document.querySelector('#region').value=defaults.region;});
const result=document.querySelector('#result'), submit=document.querySelector('#submit'), logout=document.querySelector('#logout');
const firmware=document.createElement('button');firmware.textContent='Check firmware with Anker';firmware.hidden=true;logout.before(firmware);let devices=[];
firmware.addEventListener('click',async()=>{firmware.disabled=true;result.textContent='Checking available firmware with Anker…';try{const reports=[];for(const device of devices)reports.push(await call('/api/firmware',{serial:device.device_sn}));result.textContent=reports.map(report=>`${report.model}\nInstalled: ${report.installedVersion}\n${report.available===true?'Update available: '+report.latestVersion:report.available===false?'Anker reports no update available.':'Anker returned no matching update record; availability is unknown.'}\nChecked: ${new Date(report.checkedAt).toLocaleString()}\n\n${report.components.map(component=>`${component.type}: ${component.version}\n${component.bytes} bytes · MD5 ${component.md5}`).join('\n\n')}\n\nInstallation is not supported yet. Update through the official app for now.\n\nProtocol response:\n${JSON.stringify(report.response,null,2)}`).join('\n\n');}catch(e){result.textContent=e.message;}finally{firmware.disabled=false;}});
async function call(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Local-CSRF':csrf},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Local request failed.');return data;}
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;firmware.hidden=true;devices=[];result.textContent='Signing in to Anker…';let password=document.querySelector('#password').value;document.querySelector('#password').value='';try{await call('/api/login',{email:document.querySelector('#email').value,password,country:document.querySelector('#country').value.toUpperCase(),region:document.querySelector('#region').value,offsetMinutes:new Date().getTimezoneOffset()});password='';logout.hidden=false;result.textContent='Signed in. Reading account devices…';const data=await call('/api/devices',{});devices=data.devices;firmware.hidden=!devices.length;result.textContent=data.devices.length?'Account devices:\n'+JSON.stringify(data.devices,null,2):'Signed in, but this account returned no devices. Check whether the charger appears under this account in the official app; do not reset or move it yet.';}catch(e){result.textContent=e.message;}finally{password='';submit.disabled=false;}});
logout.addEventListener('click',async()=>{try{await call('/api/logout',{});logout.hidden=true;firmware.hidden=true;devices=[];result.textContent='Local session discarded.';}catch(e){result.textContent=e.message;}});
</script></html>
